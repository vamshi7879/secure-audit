<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Secure Coding Assessment{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/" aria-label="SecureCodeAudit dashboard"><span class="brand-mark">S</span><span><strong>SecureCodeAudit</strong><small>Python Security Analysis</small></span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">Menu</button>
    <nav id="primary-nav" aria-label="Primary navigation">
      <a class="{% if request.path == '/' %}active{% endif %}" href="/"><span class="nav-icon">D</span>Dashboard</a>
      <a class="{% if request.path == '/scanner' %}active{% endif %}" href="/scanner"><span class="nav-icon">S</span>Code Scanner</a>
      <a class="{% if request.path == '/findings' %}active{% endif %}" href="/findings"><span class="nav-icon">!</span>Findings</a>
      <a class="{% if request.path == '/risk' %}active{% endif %}" href="/risk"><span class="nav-icon">R</span>Risk</a>
      <a class="{% if request.path == '/principles' %}active{% endif %}" href="/principles"><span class="nav-icon">P</span>Principles</a>
      <a class="{% if request.path == '/dependencies' %}active{% endif %}" href="/dependencies"><span class="nav-icon">D</span>Dependencies</a>
      <a class="{% if request.path == '/checklist' %}active{% endif %}" href="/checklist"><span class="nav-icon">C</span>Checklist</a>
      <a class="{% if request.path == '/history' %}active{% endif %}" href="/history"><span class="nav-icon">H</span>History</a>
      <a class="{% if request.path == '/reports' %}active{% endif %}" href="/reports"><span class="nav-icon">F</span>Reports</a>
    </nav>
  </div>
</header>
<main id="main-content" class="container">{% block content %}{% endblock %}</main>
<footer class="footer"><span>SecureCodeAudit</span><span>Educational static analysis prototype</span></footer>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
